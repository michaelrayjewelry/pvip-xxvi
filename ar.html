<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Phantom VIP Signet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@300;500&display=swap">
<style>
/* The room goes black. Only the card (drawn from the camera, inside its own outline) and the ring are lit. */
:root {
  --void: #000;
  --foil: #d9dadd;
  --mute: #8a8987;
  --display: 'Jost', 'Futura', 'Century Gothic', system-ui, sans-serif;
  color-scheme: dark;
}
html, body { margin: 0; height: 100%; background: var(--void); overflow: hidden; touch-action: none; }
body { color: var(--foil); font-family: var(--display); font-weight: 300; -webkit-font-smoothing: antialiased; }
#stage { position: fixed; inset: 0; }
#stage video { opacity: 0 !important; }      /* the camera image is only drawn inside the card */
.coach {
  position: fixed; inset: 0; pointer-events: none;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px;
  transition: opacity 0.5s ease;
}
.frame { width: min(46vw, 230px); aspect-ratio: 432 / 624; border: 1px solid rgba(217, 218, 221, 0.4); }
.cap { margin: 0; padding: 0 28px; text-align: center; font-size: 11px; letter-spacing: 0.24em; text-transform: uppercase; color: var(--mute); }
.found .coach { opacity: 0; }
.close {
  position: fixed; z-index: 2;
  top: calc(env(safe-area-inset-top, 0px) + 10px); left: calc(env(safe-area-inset-left, 0px) + 10px);
  width: 44px; height: 44px; display: grid; place-items: center;
  color: var(--foil); opacity: 0.75; text-decoration: none;
}
.close:focus-visible { outline: 1px solid var(--foil); }
.close svg { width: 16px; height: 16px; display: block; }
@media (prefers-reduced-motion: reduce) { .coach { transition: none; } }
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
</head>
<body>
<div id="stage"></div>
<div class="coach" aria-live="polite"><div class="frame"></div><p class="cap" id="cap">Starting camera</p></div>
<a class="close" href="./" aria-label="Close"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M1 1 15 15M15 1 1 15" stroke="currentColor" stroke-width="1.2" fill="none"/></svg></a>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { MindARThree } from 'https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js';

const cap = document.getElementById('cap');
const CARD_W = 0.1143;          // card width in metres; MindAR's anchor space makes the card 1 unit wide
const ASPECT = 624 / 432;       // card height / width

const mind = new MindARThree({
  container: document.getElementById('stage'),
  imageTargetSrc: './card.mind',
  maxTrack: 1, uiLoading: 'no', uiScanning: 'no', uiError: 'no',
  filterMinCF: 0.0001, filterBeta: 0.01, warmupTolerance: 3, missTolerance: 10,
});
const { renderer, scene, camera } = mind;
renderer.setClearColor(0x000000, 1);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;

// studio reflections: the room is hidden, so the ring is lit like a product shot
const pmrem = new THREE.PMREMGenerator(renderer);
new THREE.TextureLoader().load('./studio.png', (t) => {
  t.mapping = THREE.EquirectangularReflectionMapping; t.colorSpace = THREE.SRGBColorSpace;
  scene.environment = pmrem.fromEquirectangular(t).texture; t.dispose();
});


// The card: a quad 1.3x the card's size that samples the camera image at its own screen position,
// full brightness on the card and falling to black just past its edges. It also hides whatever is below the card.
const cardMat = new THREE.ShaderMaterial({
  uniforms: {
    uVideo: { value: null },
    uRect: { value: new THREE.Vector4(0, 0, 1, 1) },     // video's on-screen box in CSS px: left, top, width, height
    uCanvas: { value: new THREE.Vector3(1, 1, 1) },      // canvas width, height (device px), pixel ratio
    uFade: { value: 0 },
  },
  vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',
  fragmentShader: `
    uniform sampler2D uVideo; uniform vec4 uRect; uniform vec3 uCanvas; uniform float uFade; varying vec2 vUv;
    void main() {
      vec2 css = vec2(gl_FragCoord.x, uCanvas.y - gl_FragCoord.y) / uCanvas.z;
      vec2 uv = vec2((css.x - uRect.x) / uRect.z, 1.0 - (css.y - uRect.y) / uRect.w);
      vec3 col = texture2D(uVideo, uv).rgb;
      vec2 p = abs(vUv - 0.5) * 2.0 * 1.3;              // 1.0 on the card's edge
      float a = 1.0 - smoothstep(0.995, 1.06, max(p.x, p.y));   // a tight edge: the room stays black
      gl_FragColor = vec4(col * a * uFade, 1.0);
    }`,
  toneMapped: false,
});

// soft contact shadow texture
const sc = document.createElement('canvas'); sc.width = sc.height = 128;
const g2 = sc.getContext('2d'); const grad = g2.createRadialGradient(64, 64, 0, 64, 64, 64);
grad.addColorStop(0, 'rgba(0,0,0,0.55)'); grad.addColorStop(1, 'rgba(0,0,0,0)'); g2.fillStyle = grad; g2.fillRect(0, 0, 128, 128);
const shadowTex = new THREE.CanvasTexture(sc);

const RING_AT = 20 / 432;      // the ring stands on the axis line, 20 px above the card's centre
const rigs = [];
function makeRig(i) {
  const anchor = mind.addAnchor(i);
  const card = new THREE.Mesh(new THREE.PlaneGeometry(1.3, ASPECT * 1.3), cardMat);
  anchor.group.add(card);
  // ring space: metres, Y up off the card, +Z toward the card's bottom edge (the viewer)
  const space = new THREE.Group();
  space.rotation.x = Math.PI / 2; space.position.y = RING_AT; space.scale.setScalar(1 / CARD_W);
  anchor.group.add(space);
  const shadow = new THREE.Mesh(new THREE.PlaneGeometry(0.06, 0.05), new THREE.MeshBasicMaterial({ map: shadowTex, transparent: true, depthWrite: false, toneMapped: false, opacity: 0 }));
  shadow.rotation.x = -Math.PI / 2; shadow.position.y = 0.0004; space.add(shadow);
  const spin = new THREE.Group(); space.add(spin);
  const tilt = new THREE.Group(); spin.add(tilt);
  spin.scale.setScalar(0.0001);
  const rig = { anchor, spin, tilt, shadow, spawnAt: null, lostAt: null };
  anchor.onTargetFound = () => {
    document.body.classList.add('found');
    const now = performance.now();
    if (rig.spawnAt === null || (rig.lostAt !== null && now - rig.lostAt > 4000)) rig.spawnAt = now + 350;   // rise again after a long absence
    rig.lostAt = null; fadeTo = 1;
  };
  anchor.onTargetLost = () => {
    rig.lostAt = performance.now();
    if (!rigs.some(r => r.anchor.group.visible && r !== rig)) { document.body.classList.remove('found'); fadeTo = 0; fade = 0; }
  };
  rigs.push(rig);
}
const TARGETS = 2;
for (let i = 0; i < TARGETS; i++) makeRig(i);
new GLTFLoader().load('./phantom-signet.glb', (g) => {
  rigs.forEach((r, i) => { const m = i ? g.scene.clone() : g.scene; m.position.y = -0.0115; r.tilt.add(m); });   // pivot on the finger-hole centre
});

// the rise: face flush with the card at 1.72x (the printed ring's size), lifts and tips toward the viewer,
// grows to 2.2x and eases into one turn every 8 s with a slow hover
const T = 2.4, W = 45, A = 360 - W * T, HERO = 2.2, START = 1.72;
const ease = (u) => u * u * (3 - 2 * u);
function pose(x) {
  if (x < T) {
    const u = ease(x / T);
    const sc = START + (HERO - START) * u;
    const y = -0.01401 * START * (1 - u) + 0.0258 * u;      // face top level with the card, then the hover height
    return [-(W * x + A * u), y, sc, 40 * u, u];
  }
  return [-(W * x + A), 0.0258 + 0.0012 * Math.sin(2 * Math.PI * (x - T) / 8), HERO, 40, 1];
}
let fade = 0, fadeTo = 0;

let videoTex = null;
renderer.setAnimationLoop(() => {
  const now = performance.now();
  fade += (fadeTo - fade) * 0.1;
  cardMat.uniforms.uFade.value = fade;
  const v = mind.video;
  if (v) {
    cardMat.uniforms.uRect.value.set(parseFloat(v.style.left) || 0, parseFloat(v.style.top) || 0, parseFloat(v.style.width) || 1, parseFloat(v.style.height) || 1);
    cardMat.uniforms.uCanvas.value.set(renderer.domElement.width, renderer.domElement.height, renderer.getPixelRatio());
  }
  for (const r of rigs) {
    if (r.spawnAt === null) continue;
    const [ang, y, sc, tl, u] = pose(Math.max(0, (now - r.spawnAt) / 1000));
    r.spin.rotation.y = THREE.MathUtils.degToRad(ang); r.spin.position.y = y; r.spin.scale.setScalar(sc);
    r.tilt.rotation.x = THREE.MathUtils.degToRad(tl);
    r.shadow.material.opacity = u; r.shadow.scale.setScalar(0.6 + 0.4 * u);
  }
  renderer.render(scene, camera);
});

try {
  await mind.start();
  videoTex = new THREE.VideoTexture(mind.video);
  videoTex.colorSpace = THREE.NoColorSpace; videoTex.minFilter = THREE.LinearFilter; videoTex.generateMipmaps = false;
  cardMat.uniforms.uVideo.value = videoTex;
  cap.textContent = 'Point at the card';
  window.__ar = { started: true };
} catch (e) {
  cap.textContent = 'Allow camera access to see the ring on your card';
  window.__ar = { started: false, error: String(e) };
}
window.__arState = () => ({ found: document.body.classList.contains('found'), spawned: rigs.some(r => r.spawnAt !== null), fade });
</script>
</body>
</html>
