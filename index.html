<style>
/* Layout: one screen of folder black. The ghost at the top, the ring filling the middle,
   one octagonal button at the bottom. Nothing else. Single dark look by choice (the inside of the folder). */
:root {
  --ink: #1c1c1c;      /* folder black */
  --cotton: #fffdf8;   /* card stock */
  --foil: #d9dadd;     /* silver foil */
  --mute: #8a8987;
  --lilac: #ab9ff2;    /* Phantom purple, the sapphire */
  --display: 'Jost', 'Futura', 'Century Gothic', system-ui, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; background: var(--ink); }
body { color: var(--foil); font-family: var(--display); font-weight: 300; -webkit-font-smoothing: antialiased; }
.screen {
  box-sizing: border-box;
  height: 100%;
  max-width: 560px;
  margin: 0 auto;
  display: grid;
  grid-template-rows: auto minmax(0, 1fr) auto;
  justify-items: center;
  padding-block: 22px 28px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.mark { width: 26px; height: auto; display: block; }
model-viewer {
  width: 100%; height: 100%; min-height: 280px;
  background: transparent; outline: none;
  --poster-color: transparent; --progress-bar-color: transparent;
}
.dock { display: flex; flex-direction: column; align-items: center; gap: 14px; min-height: 50px; }
/* the octagon of the ring face, as a button */
.oct {
  appearance: none; border: 0; cursor: pointer;
  width: 260px; max-width: 100%; height: 50px;
  background: var(--cotton); color: var(--ink);
  font: 500 12px/1 var(--display); letter-spacing: 0.26em; text-transform: uppercase; padding-left: 0.26em;
  clip-path: polygon(12px 0, calc(100% - 12px) 0, 100% 12px, 100% calc(100% - 12px), calc(100% - 12px) 100%, 12px 100%, 0 calc(100% - 12px), 0 12px);
  transition: background-color 0.2s ease;
}
.oct:hover { background: #f1eee7; }
.oct:focus-visible { background: var(--lilac); outline: none; }
.alt {
  appearance: none; border: 0; background: none; cursor: pointer; padding: 4px 6px;
  color: var(--mute); font: 300 11px/1 var(--display); letter-spacing: 0.22em; text-transform: uppercase;
}
.alt:hover, .alt:focus-visible { color: var(--foil); outline: none; }
.hint { margin: 0; color: var(--mute); font-size: 11px; letter-spacing: 0.22em; text-transform: uppercase; }
.progress {
  position: fixed; left: 0; top: env(safe-area-inset-top, 0px); height: 1px; width: 0%;
  background: var(--lilac); transition: width 0.2s linear, opacity 0.5s ease;
}
@media (prefers-reduced-motion: reduce) { .progress, .oct { transition: none; } }
</style>

      auto-rotate auto-rotate-delay="1500" rotation-per-second="14deg"
      interaction-prompt="none"
      environment-image="studio.png" tone-mapping="neutral" exposure="1.08" shadow-intensity="0"

    <span slot="ar-button" hidden></span>
    <span slot="progress-bar"></span>
  </model-viewer>

  <div class="dock">
    <button class="oct" id="arMain" type="button" hidden>View on your card</button>
    <button class="alt" id="arTable" type="button" hidden>or on the table</button>
    <p class="hint" id="noAr">Open on your phone</p>
  </div>
</main>
<div class="progress" id="progress"></div>

<script type="module">
const mv = document.getElementById('ring');
const main = document.getElementById('arMain');
const table = document.getElementById('arTable');
const noAr = document.getElementById('noAr');
const bar = document.getElementById('progress');

const ua = navigator.userAgent;
const isIOS = /iPad|iPhone|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const quickLookOK = (() => { try { return document.createElement('a').relList.supports('ar'); } catch (e) { return false; } })();

// iPhone and iPad: open AR Quick Look on one of the two USDZ files.
function quickLook(file) {
  const a = document.createElement('a');
  a.setAttribute('rel', 'ar');
  const blob = window.__usdz && window.__usdz[file];
  a.href = blob || new URL(file, location.href).href;
  if (blob) a.setAttribute('download', file);   // tells Safari what a blob: link holds
  a.appendChild(document.createElement('img'));
  document.body.appendChild(a);
  a.click();
  a.remove();
}

function offerAR() {
  if (isIOS && quickLookOK) {
    main.hidden = false; table.hidden = false; noAr.hidden = true;
    return;
  }
  if (mv.canActivateAR) {   // Android (Scene Viewer / WebXR) cannot anchor to the card, so the ring goes on the table
    main.textContent = 'View in your space';
    main.hidden = false; noAr.hidden = true;
  }
}

main.addEventListener('click', () => (isIOS && quickLookOK) ? quickLook('phantom-signet-on-card.usdz') : mv.activateAR());
table.addEventListener('click', () => quickLook('phantom-signet-on-table.usdz'));

mv.addEventListener('progress', (e) => {
  const p = e.detail.totalProgress;
  bar.style.width = (p * 100).toFixed(1) + '%';
  if (p >= 1) bar.style.opacity = '0';
});
mv.addEventListener('load', offerAR);
customElements.whenDefined('model-viewer').then(() => setTimeout(offerAR, 0));
</script>
