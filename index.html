<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1c1c1c">
<title>Phantom VIP · XXV</title>
<link rel="preload" href="ibm-plex-mono-latin-500-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="jost-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<script type="module" src="model-viewer-4.1.0.min.js"></script>
<style>
/* Everything the page needs is in this repository: the fonts (woff2) and the viewer (model-viewer-4.1.0.min.js) sit next to this page. */
@font-face { font-family: 'Jost'; font-style: normal; font-weight: 300; font-display: swap; src: url(jost-latin-300-normal.woff2) format('woff2'); }
@font-face { font-family: 'Jost'; font-style: normal; font-weight: 400; font-display: swap; src: url(jost-latin-400-normal.woff2) format('woff2'); }
@font-face { font-family: 'Jost'; font-style: normal; font-weight: 500; font-display: swap; src: url(jost-latin-500-normal.woff2) format('woff2'); }
@font-face { font-family: 'IBM Plex Mono'; font-style: normal; font-weight: 400; font-display: swap; src: url(ibm-plex-mono-latin-400-normal.woff2) format('woff2'); }
@font-face { font-family: 'IBM Plex Mono'; font-style: normal; font-weight: 500; font-display: swap; src: url(ibm-plex-mono-latin-500-normal.woff2) format('woff2'); }

/* The folder's black board, its silver hairline, and the card's set stone: a Phantom-purple dot,
   a gap that breaks the line, and a hairline bezel. Type as on the card: Jost for the XXV, IBM Plex Mono
   (the provenance receipt) for the rest. */
:root {
  --ink: #1c1c1c;
  --foil: #d9dadd;
  --mute: #8a8987;
  --lilac: #ab9ff2;
  --display: 'Jost', 'Futura', 'Century Gothic', system-ui, sans-serif;
  --mono: 'IBM Plex Mono', 'SF Mono', Menlo, Consolas, monospace;
  --y: 50%;            /* the diameter line */
  color-scheme: dark;
}
html, body { margin: 0; height: 100%; background: var(--ink); overflow: hidden; }
body {
  color: var(--foil); font-family: var(--display); font-weight: 300;
  -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
  -webkit-user-select: none; user-select: none; touch-action: manipulation;
}
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap; }

/* the 3D ring: only shown on devices without AR, and while Android's in-browser AR is open */
#ring {
  position: fixed; inset: 0; width: 100%; height: 100%;
  background: transparent; outline: none; opacity: 0; pointer-events: none;
  transform: translateX(-300vw);     /* off screen while hidden, so it loads but doesn't render (saves battery, keeps the intro smooth) */
  transition: opacity 0.6s ease;
  --poster-color: transparent; --progress-bar-color: transparent;
}
#ring.show, #ring.xr { opacity: 1; pointer-events: auto; transform: none; }

#stage { position: fixed; inset: 0; transition: opacity 0.5s ease; }
#stage.instant, #stage.instant * { transition: none !important; animation: none !important; }
#stage.away { opacity: 0; pointer-events: none; }
/* decoration never takes a tap: the screen-sized button underneath does */
.type, .axis, .stone, .ping, .iris, .cap { pointer-events: none; }

/* 1 · the typed lines */
.type {
  position: absolute; left: 0; right: 0; top: var(--y); transform: translateY(-50%);
  display: flex; flex-direction: column; align-items: center; gap: 18px;
  transition: opacity 0.7s ease;
}
.type.out { opacity: 0; }
.t { margin: 0; line-height: 1; white-space: nowrap; text-transform: uppercase; }
.t1 { font: 500 11px/1 var(--mono); letter-spacing: 0.32em; padding-left: 0.32em; }
.t2 { font: 400 27px/1 var(--display); letter-spacing: 0.36em; padding-left: 0.36em; }
.t3 { font: 400 10.5px/1 var(--mono); letter-spacing: 0.24em; padding-left: 0.24em; color: var(--mute); }
.t > span:not(.caret) { opacity: 0; }
.t > span.on { opacity: 1; }
.caret { display: inline-block; width: 0; height: 1em; position: relative; vertical-align: baseline; }
.caret::before {
  content: ''; position: absolute; left: -0.05em; bottom: -0.16em; width: 1px; height: 1.22em;
  background: var(--foil); animation: blink 1.05s steps(1, end) infinite;
}
.caret.typing::before { animation: none; }
@keyframes blink { 0%, 55% { opacity: 1; } 56%, 100% { opacity: 0; } }

/* 2 · the diameter line draws itself, edge to edge */
.axis {
  position: absolute; left: 0; right: 0; top: var(--y); height: 1px; margin-top: -0.5px;
  background: var(--foil); transform: scaleX(0); transform-origin: 0 50%;
}
.axis.draw { transform: scaleX(1); transition: transform 1.15s cubic-bezier(0.65, 0, 0.35, 1); }

/* 3 · the set stone rides the line in to the centre */
.stone {
  position: absolute; left: 50%; top: var(--y); width: 16px; height: 16px; margin: -8px 0 0 -8px;
  border-radius: 50%; background: var(--lilac);
  box-shadow: 0 0 0 5px var(--ink), 0 0 0 6px var(--foil);
  transform: translateX(calc(-50vw - 40px));
}
.stone.travel { transform: translateX(0); transition: transform 1.9s cubic-bezier(0.22, 0.8, 0.24, 1); }
.ping {
  position: absolute; left: 50%; top: var(--y); width: 28px; height: 28px; margin: -14px 0 0 -14px;
  box-sizing: border-box; border: 1px solid var(--foil); border-radius: 50%; opacity: 0; pointer-events: none;
}
.ready .ping { animation: ping 3s cubic-bezier(0.2, 0.6, 0.3, 1) 0.8s infinite; }
@keyframes ping { 0% { transform: scale(1); opacity: 0.5; } 70%, 100% { transform: scale(2.3); opacity: 0; } }

.cap {
  position: absolute; left: 0; right: 0; top: calc(var(--y) + 48px); margin: 0; text-align: center;
  opacity: 0; transition: opacity 0.7s ease;
}
.ready .cap { opacity: 1; }
.cap b { display: block; font: 500 11px/1 var(--display); letter-spacing: 0.26em; padding-left: 0.26em; text-transform: uppercase; }
.cap small { display: block; margin-top: 13px; font: 400 9.5px/1 var(--mono); letter-spacing: 0.24em; padding-left: 0.24em; text-transform: uppercase; color: var(--mute); }

/* the whole screen is the button once the stone has arrived */
.go { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; padding: 0; border: 0; background: none; cursor: pointer; }
.go:disabled { cursor: default; pointer-events: none; }   /* during the intro a tap reaches the stage and skips ahead */
.go:focus-visible { outline: none; }
.go:focus-visible ~ .ping { opacity: 0.6; }

/* 4 · tap: the bezel opens like a lens and the stone dissolves into it */
.iris {
  position: absolute; left: 50%; top: var(--y); width: 28px; height: 28px; transform: translate(-50%, -50%);
  box-sizing: border-box; border: 1px solid var(--foil); border-radius: 50%; opacity: 0; pointer-events: none;
  background: radial-gradient(circle closest-side, rgba(171, 159, 242, 0.16), rgba(217, 218, 221, 0.05) 62%, rgba(217, 218, 221, 0) 100%);
}
.opening .iris {
  opacity: 1; width: var(--lens, 200vmax); height: var(--lens, 200vmax);
  transition: width 1s cubic-bezier(0.7, 0, 0.25, 1), height 1s cubic-bezier(0.7, 0, 0.25, 1), opacity 0.12s linear;
}
.opening .stone { box-shadow: 0 0 0 5px var(--ink), 0 0 0 6px rgba(217, 218, 221, 0); transform: scale(2.2); opacity: 0; filter: blur(5px);
  transition: transform 0.85s cubic-bezier(0.5, 0, 0.75, 0), opacity 0.7s ease-in 0.1s, filter 0.85s ease-in, box-shadow 0.1s; }
.opening .axis { opacity: 0; transition: opacity 0.45s ease; }
.opening .cap, .opening .ping { opacity: 0; transition: opacity 0.25s ease; animation: none; }

.close {
  position: fixed; z-index: 3; top: calc(env(safe-area-inset-top, 0px) + 10px); left: calc(env(safe-area-inset-left, 0px) + 10px);
  width: 44px; height: 44px; display: grid; place-items: center; padding: 0; border: 0; background: none;
  color: var(--foil); opacity: 0.75; cursor: pointer;
}
.close svg { width: 16px; height: 16px; display: block; }
.close:focus-visible { outline: 1px solid var(--foil); }
.hint {
  position: fixed; z-index: 3; left: 0; right: 0; bottom: calc(env(safe-area-inset-bottom, 0px) + 28px); margin: 0;
  text-align: center; font: 400 9.5px/1.6 var(--mono); letter-spacing: 0.24em; text-transform: uppercase; color: var(--mute);
}
[hidden] { display: none !important; }
</style>
</head>
<body>
<h1 class="sr">Phantom VIP XXV, the signet in 925 sterling silver</h1>

<model-viewer id="ring"
    src="phantom-signet-ar.glb"
    ios-src="phantom-signet-on-table.usdz"
    alt="The Phantom VIP signet in 925 sterling silver: an octagonal face with a lilac sapphire and a trillion diamond set across its diameter"
    loading="eager"
    camera-controls disable-pan touch-action="pan-y"
    auto-rotate auto-rotate-delay="0" rotation-per-second="14deg"
    interaction-prompt="none"
    environment-image="studio.png" tone-mapping="neutral" exposure="1.08" shadow-intensity="0"
    camera-orbit="0deg 70deg 100%" min-camera-orbit="auto 8deg auto" max-camera-orbit="auto 112deg auto"
    field-of-view="25deg"
    ar ar-modes="webxr scene-viewer quick-look" ar-scale="fixed" ar-placement="floor">
  <span slot="ar-button" hidden></span>
  <span slot="progress-bar"></span>
</model-viewer>

<div id="stage">
  <div class="type" id="type" aria-hidden="true">
    <p class="t t1">Phantom VIP</p>
    <p class="t t2">XXV</p>
    <p class="t t3">925 Sterling Silver</p>
  </div>
  <div class="axis" id="axis"></div>
  <button class="go" id="go" type="button" aria-label="Place the ring in your space" disabled></button>
  <div class="ping" aria-hidden="true"></div>
  <div class="stone" id="stone" aria-hidden="true"></div>
  <div class="iris" id="iris" aria-hidden="true"></div>
  <p class="cap" id="cap" aria-live="polite"><b id="capMain">View in your space</b><small id="capSub">Tap the stone</small></p>
</div>

<button class="close" id="close" type="button" aria-label="Close" hidden><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M1 1 15 15M15 1 1 15" stroke="currentColor" stroke-width="1.2" fill="none"/></svg></button>
<p class="hint" id="hint" hidden>Open this page on your phone<br>to place the ring in your space</p>

<script type="module">
const $ = (id) => document.getElementById(id);
const stage = $('stage'), mv = $('ring'), go = $('go'), stone = $('stone'), axis = $('axis'), type = $('type');
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const ua = navigator.userAgent;
const isIOS = /iPad|iPhone|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const quickLookOK = (() => { try { return document.createElement('a').relList.supports('ar'); } catch (e) { return false; } })();
const USDZ = 'phantom-signet-on-table.usdz';   // iPhone: AR Quick Look, placed on any horizontal surface
let state = 'intro';

// how this phone places the ring: iPhone Quick Look, Android (WebXR or Scene Viewer), or no AR (3D view)
const arKind = () => (isIOS && quickLookOK) ? 'quicklook' : (!isIOS && mv.canActivateAR) ? 'android' : 'none';
if (isIOS && quickLookOK) fetch(USDZ).catch(() => {});      // warm the cache during the intro

// ---------- the intro, skippable with a tap ----------
let timers = [], skipping = false;
const wait = (ms) => skipping ? Promise.resolve() : new Promise((r) => { timers.push([setTimeout(r, ms), r]); });
function skip() {
  if (state !== 'intro' || skipping) return;
  skipping = true;
  stage.classList.add('instant');
  timers.forEach(([t, r]) => { clearTimeout(t); r(); }); timers = [];
}
stage.addEventListener('pointerdown', skip);

const lines = [...type.querySelectorAll('.t')].map((el) => {
  const text = el.textContent; el.textContent = '';
  const chars = [...text].map((c) => { const s = document.createElement('span'); s.textContent = c; el.appendChild(s); return s; });
  return { el, chars };
});
const caret = document.createElement('span'); caret.className = 'caret';
const pace = [72, 150, 52];                 // ms per character: the XXV lands slower

async function intro() {
  if (reduce) {
    lines.forEach((l) => l.chars.forEach((c) => c.classList.add('on')));
    await wait(2200);
    type.classList.add('out'); await wait(700);
    stage.classList.add('instant');
  } else {
    await wait(450);
    for (const [i, l] of lines.entries()) {
      l.chars[0].before(caret);
      await wait(260);
      caret.classList.add('typing');
      for (const c of l.chars) {
        c.classList.add('on'); c.after(caret);
        await wait(pace[i] + (c.textContent === ' ' ? 40 : Math.random() * 40));
      }
      caret.classList.remove('typing');
      await wait(i === lines.length - 1 ? 1100 : 380);
    }
    caret.remove();
    type.classList.add('out'); await wait(750);
  }
  lines.forEach((l) => l.chars.forEach((c) => c.classList.add('on')));
  type.classList.add('out'); caret.remove();
  axis.classList.add('draw'); await wait(700);
  stone.classList.add('travel'); await wait(1900);
  ready();
}

function caption() {
  const k = arKind();
  $('capMain').textContent = k === 'none' ? 'View the ring' : 'View in your space';
  $('capSub').textContent = 'Tap the stone';
  go.setAttribute('aria-label', k === 'none' ? 'View the ring in 3D' : 'Place the ring in your space');
}
function ready() {
  stage.removeEventListener('pointerdown', skip);
  requestAnimationFrame(() => stage.classList.remove('instant'));
  caption();
  state = 'ready'; go.disabled = false; stage.classList.add('ready');
}
mv.addEventListener('load', () => { if (state === 'ready') caption(); });

// ---------- tap: open the lens, then hand over to the phone's AR ----------
function quickLook(file) {
  const a = document.createElement('a');
  a.setAttribute('rel', 'ar');
  a.href = new URL(file, location.href).href;
  a.appendChild(document.createElement('img'));
  document.body.appendChild(a); a.click(); a.remove();
}
go.addEventListener('click', () => {
  if (state !== 'ready') return;
  state = 'opening';
  const kind = arKind();
  stage.style.setProperty('--lens', Math.ceil(2.1 * Math.hypot(innerWidth, innerHeight)) + 'px');
  stage.classList.remove('ready'); stage.classList.add('opening');
  const handoff = reduce ? 0 : 430;       // inside the tap's user-gesture window on iOS and Android
  if (kind === 'quicklook') { setTimeout(() => quickLook(USDZ), handoff); setTimeout(restore, 1800); }
  else if (kind === 'android') { mv.classList.add('xr'); setTimeout(() => mv.activateAR(), handoff); setTimeout(restore, 1800); }
  else setTimeout(showViewer, reduce ? 0 : 950);
});

// Android's in-browser AR keeps the viewer up until its session ends
mv.addEventListener('ar-status', (e) => { if (e.detail.status === 'not-presenting' && state === 'opening') restore(); });

function showViewer() {
  state = 'viewer';
  mv.classList.add('show'); stage.classList.add('away');
  $('close').hidden = false; $('hint').hidden = false;
}
$('close').addEventListener('click', () => { $('close').hidden = true; $('hint').hidden = true; restore(); });

// back to the stone on the line, ready for another tap (on iPhone this happens behind Quick Look)
function restore() {
  if (mv.getAttribute('ar-status') === 'session-started') return;
  stage.classList.add('instant', 'away');
  stage.classList.remove('opening');
  mv.classList.remove('xr', 'show');
  void stage.offsetWidth;
  stage.classList.remove('instant');
  stage.classList.remove('away');
  stage.classList.add('ready');
  state = 'ready';
}
addEventListener('pageshow', (e) => { if (e.persisted && state === 'opening') restore(); });

document.fonts.ready.then(intro);
</script>
</body>
</html>
