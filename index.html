<style>
/* Layout: one narrow column on folder black, read top to bottom like the card:
   the ghost and XXVI, the ring on its own stage, one action, the ghost | CryptoJeweler lockup.
   A single dark look by choice (it is the inside of the folder), so colours are set once, here. */
:root {
  --ink: #1c1c1c;        /* folder black */
  --ink-deep: #121212;   /* the stage */
  --cotton: #fffdf8;     /* card stock */
  --foil: #d9dadd;       /* silver foil on the cover */
  --mute: #8f8e8b;       /* captions */
  --lilac: #ab9ff2;      /* Phantom purple, the sapphire */
  --rule: #3a3a39;
  --display: 'Jost', 'Futura', 'Century Gothic', system-ui, sans-serif;
  color-scheme: dark;
}
html { background: var(--ink); }
body {
  background: var(--ink);
  color: var(--foil);
  font-family: var(--display);
  font-weight: 300;
  font-size: 15px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
.wrap {
  max-width: 520px;
  margin: 0 auto;
  padding-block: 28px 36px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 22px;
}
.mast { display: flex; flex-direction: column; align-items: center; gap: 14px; }
.mast svg { width: 34px; height: auto; display: block; }
.mast h1 {
  margin: 0;
  font-size: 13px;
  font-weight: 400;
  letter-spacing: 0.42em;
  padding-left: 0.42em;          /* optical centring of tracked caps */
  color: var(--foil);
}
.stage {
  position: relative;
  width: 100%;
  max-width: 100%;
  aspect-ratio: 1 / 1.08;
  background: radial-gradient(120% 90% at 50% 38%, #232323 0%, var(--ink-deep) 70%);
  overflow: hidden;
}
model-viewer {
  width: 100%;
  height: 100%;
  background: transparent;
  --poster-color: transparent;
  --progress-bar-color: transparent;
  outline: none;
}
.progress {
  position: absolute; left: 0; bottom: 0; height: 1px; width: 0%;
  background: var(--lilac); transition: width 0.2s linear, opacity 0.4s ease;
}
.drag {
  position: absolute; left: 0; right: 0; bottom: 12px; margin: 0;
  text-align: center; font-size: 11px; letter-spacing: 0.24em; text-transform: uppercase; color: var(--mute);
  pointer-events: none;
}
.actions { width: 100%; display: flex; flex-direction: column; align-items: center; gap: 12px; }
/* the octagon of the ring face, as a button */
.oct {
  appearance: none; border: 0; cursor: pointer;
  width: min(100%, 300px); height: 50px;
  background: var(--cotton); color: var(--ink);
  font: 500 12px/1 var(--display); letter-spacing: 0.26em; text-transform: uppercase; padding-left: 0.26em;
  clip-path: polygon(12px 0, calc(100% - 12px) 0, 100% 12px, 100% calc(100% - 12px), calc(100% - 12px) 100%, 12px 100%, 0 calc(100% - 12px), 0 12px);
  transition: background-color 0.2s ease;
}
.oct:hover { background: #f1eee7; }
.oct:focus-visible { background: var(--lilac); outline: none; }
.link {
  appearance: none; border: 0; background: none; cursor: pointer; color: var(--foil);
  font: 300 14px/1.4 var(--display); letter-spacing: 0.02em;
  text-decoration: underline; text-decoration-color: var(--rule); text-underline-offset: 5px;
  padding: 6px 4px;
}
.link:hover { text-decoration-color: var(--foil); }
.link:focus-visible { outline: 1px solid var(--lilac); outline-offset: 3px; }
.note { margin: 2px 0 0; max-width: 34ch; text-align: center; font-size: 13px; color: var(--mute); text-wrap: balance; }
.foot { display: flex; flex-direction: column; align-items: center; gap: 12px; padding-top: 10px; }
.lockup { display: flex; align-items: center; gap: 14px; }
.lockup svg { width: 22px; height: auto; display: block; }
.lockup img { width: 22px; height: auto; display: block; opacity: 0.9; }
.lockup i { width: 1px; height: 18px; background: var(--foil); opacity: 0.6; }
.spec { margin: 0; font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--mute); text-align: center; }
@media (prefers-reduced-motion: reduce) { .progress, .oct { transition: none; } }
</style>

<script type="module">
const mv = document.getElementById('ring');
const main = document.getElementById('arMain');
const table = document.getElementById('arTable');
const arNote = document.getElementById('arNote');
const noAr = document.getElementById('noAr');
const bar = document.getElementById('progress');

const ua = navigator.userAgent;
const isIOS = /iPad|iPhone|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const quickLookOK = (() => { try { return document.createElement('a').relList.supports('ar'); } catch (e) { return false; } })();

// iPhone and iPad: open AR Quick Look on one of the two USDZ files.
function quickLook(file) {
  const a = document.createElement('a');
  a.setAttribute('rel', 'ar');
  const blob = window.__usdz && window.__usdz[file];
  a.href = blob || new URL(file, location.href).href;
  if (blob) a.setAttribute('download', file);   // tells Safari what a blob: link holds
  a.appendChild(document.createElement('img'));
  document.body.appendChild(a);
  a.click();
  a.remove();
}

function offerAR() {
  if (isIOS && quickLookOK) {
    main.hidden = false; table.hidden = false; arNote.hidden = false; noAr.hidden = true;
    return;
  }
  if (mv.canActivateAR) {   // Android (Scene Viewer / WebXR): no card anchoring, the ring is placed on the table
    main.textContent = 'See it in your space';
    arNote.textContent = 'Point your phone at the table beside the card, then tap to place the ring.';
    main.hidden = false; arNote.hidden = false; noAr.hidden = true;
  }
}

main.addEventListener('click', () => (isIOS && quickLookOK) ? quickLook('phantom-signet-on-card.usdz') : mv.activateAR());
table.addEventListener('click', () => quickLook('phantom-signet-on-table.usdz'));

mv.addEventListener('progress', (e) => {
  const p = e.detail.totalProgress;
  bar.style.width = (p * 100).toFixed(1) + '%';
  if (p >= 1) bar.style.opacity = '0';
});
mv.addEventListener('load', offerAR);
customElements.whenDefined('model-viewer').then(() => setTimeout(offerAR, 0));
</script>
